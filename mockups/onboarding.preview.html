<!doctype html>
<html lang="es">
<!-- ds-allow: C1, B1 — son nueve pantallas en nueve teléfonos, cada una con un solo primario; las clases .onb-* componen splash, fondo con foto, ilustración, título de dos tonos, indicador de pasos y título de paso, que el DS no tiene (gaps anotados en design/onboarding.md), y usan solo tokens -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onboarding — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- variables → MARCA → base → composition → components → preview-native -->
<link rel="stylesheet" href="../vendor/embassy/css/variables.css">
<link rel="stylesheet" href="../brand/calma.css">
<link rel="stylesheet" href="../brand/calma.screen.css">
<link rel="stylesheet" href="../vendor/embassy/css/base.css">
<link rel="stylesheet" href="../vendor/embassy/css/composition.css">
<link rel="stylesheet" href="../vendor/embassy/css/components.css">
<link rel="stylesheet" href="../vendor/embassy/css/preview-native.css">
<style>
  /* Página de revisión: dónde se paran los teléfonos. */
  body { margin: 0; background: var(--surface-container-high); padding: var(--space-10) var(--space-4) var(--space-16); }
  .phone-row { justify-content: center; flex-wrap: wrap; }

  /* ── Fondos de marca (gap del DS: no hay pantalla de bienvenida). Solo roles de color. ── */
  .onb-wash { background:
      radial-gradient(120% 70% at 15% 10%, var(--primary-container) 0%, transparent 60%),
      radial-gradient(90% 60% at 90% 85%, var(--secondary-container) 0%, transparent 65%),
      var(--surface); }
  /* Capa de fondo a sangre, detrás de la barra de estado y de los botones */
  .onb-bg   { position: absolute; inset: 0; }
  .onb-full { flex: 1; display: flex; flex-direction: column; position: relative; }
  .onb-foot { position: relative; display: flex; flex-direction: column; gap: var(--space-2);
              padding: var(--space-3) var(--screen-gutter) var(--space-6); }
  .onb-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: var(--space-3); padding: 0 var(--screen-gutter); }
  /* En pantallas centradas, el contenido flota al medio y los botones van abajo, a ancho completo */
  .onb-center > :first-child { margin-top: auto; }
  .onb-center > .onb-foot { margin-top: auto; align-self: stretch; margin-inline: calc(var(--screen-gutter) * -1); }
  .onb-wordmark { font-family: var(--font-heading); font-size: var(--font-size-display); line-height: var(--line-height-display); color: var(--on-surface); }
  .onb-tagline { font-size: var(--font-size-body-md); line-height: var(--line-height-body-md); color: var(--on-surface-variant); margin: 0; }

  /* Foto con velo (paso de intro 1) */
  .onb-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 30%; }
  .onb-veil  { position: absolute; inset: 0; background: linear-gradient(to top,
      var(--surface) 0%, var(--surface) 30%,
      color-mix(in srgb, var(--primary-container) 80%, transparent) 52%,
      color-mix(in srgb, var(--secondary-container) 40%, transparent) 72%, transparent 100%); }


  /* Título de dos tonos: la segunda mitad en el acento */
  .onb-title { margin: 0; font-family: var(--font-heading); font-weight: 400;
               font-size: var(--font-size-display); line-height: var(--line-height-display); color: var(--on-surface); }
  .onb-title em { font-style: italic; color: var(--secondary); }

  /* Bloque inferior de las láminas de intro */
  .onb-intro { position: relative; margin-top: auto; padding: 0 var(--screen-gutter) var(--space-4); display: flex; flex-direction: column; gap: var(--space-5); }
  .onb-dots { display: flex; gap: var(--space-1-5); }
  .onb-dots i { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--outline-variant); display: block; }
  .onb-dots i[aria-current] { width: 24px; background: var(--on-surface); }
  .onb-terms { font-size: var(--font-size-caption); line-height: var(--line-height-caption); color: var(--on-surface-variant); }
  .onb-terms a { color: var(--on-surface); }

  /* Pasos de pregunta */
  .onb-top { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--screen-gutter); }
  .onb-top .progress { flex: 1; }
  .onb-count { font-size: var(--font-size-caption); font-weight: 600; color: var(--on-surface-variant); }
  .onb-q { display: flex; flex-direction: column; gap: var(--screen-block-gap); }
  /* La pantalla scrollea entre la cabecera y los botones, con el mismo margen lateral que ellos */
  .onb-scroll { flex: 1; overflow-y: auto; padding-bottom: var(--space-6); }
  /* Contenido sobre el degradé: sin el fondo sólido de .screen */
  .onb-content { position: relative; padding: 0 var(--screen-gutter); }
  /* Nota al pie de un grupo, alineada con el texto de las filas */
  .onb-note { margin: calc(var(--space-2) * -1) 0 0; padding: 0 var(--screen-group-padding); font-size: var(--font-size-caption); line-height: var(--line-height-caption); color: var(--on-surface-variant); }
  .onb-actions { display: flex; flex-direction: column; gap: var(--space-2); }
  .onb-celebrate { font-family: var(--font-heading); font-style: italic; font-size: var(--font-size-heading-xl); color: var(--secondary); margin: 0; }
</style>
</head>
<body>

<!-- Lo que este preview no muestra: elevación de Android, ripple, rebote del scroll,
     teclado y diálogo de permisos del sistema, fuentes del dispositivo, el deslizar del carrusel. -->
<script>
  // Términos: activan los botones de su mismo teléfono.
  document.querySelectorAll('[data-terms]').forEach(cb => cb.addEventListener('change', () => {
    cb.closest('.phone').querySelectorAll('[data-needs-terms]').forEach(b => b.disabled = !cb.checked);
  }));
  document.querySelectorAll('.chip[aria-pressed]').forEach(b => b.addEventListener('click', () =>
    b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'))));
</script>
